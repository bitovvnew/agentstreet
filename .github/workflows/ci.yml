name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:locales
      - run: npm test
      - name: Check the Windows setup entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: call setup.bat --help
      - name: Check the Unix setup entry point
        if: runner.os != 'Windows'
        run: ./setup.sh --help
      - name: Headless market + replay verification
        run: |
          node bin/agentstreet.js run --offline --scenario flash-crash --seed 7 --ticks 390 --out replays/ci.street.json.gz
          node bin/agentstreet.js verify replays/ci.street.json.gz
          node bin/agentstreet.js highlights replays/ci.street.json.gz
          node bin/agentstreet.js tournament --offline --seeds 1-2 --scenarios default --ticks 24 --out replays/season
